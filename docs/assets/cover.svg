  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#fff0d5">
    <text x="62" y="148" font-size="72">Infinite</text>
    <text x="62" y="230" font-size="82">Chocolatier</text>
  </g>
  <path d="M66 265H142" stroke="#e8b66a" stroke-width="3"/>
