<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Infinite Chocolatier</title>
<desc id="desc">Маленький фокус. Большое шоколадное дело. Иллюстрация плитки с одной лишней долькой.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211813"/><stop offset="1" stop-color="#3a251a"/></linearGradient>
  <linearGradient id="tile" x2="0.8" y2="1"><stop stop-color="#925532"/><stop offset="0.5" stop-color="#6d381f"/><stop offset="1" stop-color="#4e2617"/></linearGradient>
  <linearGradient id="face" x2="1" y2="1"><stop stop-color="#85482a"/><stop offset="1" stop-color="#66321c"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#f5ce91" opacity=".08"/></pattern>
  <g id="square"><rect width="48" height="55" rx="6" fill="url(#tile)"/><path d="M5 8 9 4H39L43 8V47L39 51H9L5 47Z" fill="url(#face)" stroke="#b8794e" stroke-opacity=".34"/><path d="M9 9H39" stroke="#cb9163" stroke-opacity=".32"/></g>
</defs>
<rect width="1280" height="440" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="438" rx="23" fill="none" stroke="#bb8852" stroke-opacity=".35"/>
