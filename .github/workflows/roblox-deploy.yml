name: Проверка и деплой Roblox place

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-publish-main
  cancel-in-progress: false

env:
  ROBLOX_UNIVERSE_ID: "10753469348"
  ROBLOX_PLACE_ID: "82798785130025"
  RELEASE_FILE: /tmp/infinite-chocolatier-release.rbxlx

jobs:
  verify-and-publish:
    name: Тесты, сборка и публикация
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить закреплённые Roblox-инструменты
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Запустить тесты
        run: lune run tests/run

      - name: Собрать place
        run: rojo build --output "$RELEASE_FILE"

      - name: Опубликовать через Roblox Open Cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${ROBLOX_API_KEY:-}" ]]; then
            echo "::error::Repository secret ROBLOX_API_KEY не задан."
            exit 1
          fi

          response_file="$(mktemp)"
          http_code="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://apis.roblox.com/universes/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@${RELEASE_FILE}")"

          if [[ "$http_code" != 2?? ]]; then
            echo "::error::Roblox Open Cloud вернул HTTP $http_code."
            cat "$response_file"
            exit 1
          fi

          version_number="$(jq -er '.versionNumber | numbers' "$response_file")"
          echo "Опубликован Roblox versionNumber=${version_number}"
